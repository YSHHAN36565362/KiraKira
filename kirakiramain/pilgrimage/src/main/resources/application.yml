spring:
  application:
    name: pilgrimage
  datasource:
    url: jdbc:mariadb://localhost:3306/pilgrimage?useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    driver-class-name: org.mariadb.jdbc.Driver
    username: root
    password: 1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect
  sql:
    init:
      mode: embedded
      encoding: UTF-8
      data-locations: classpath:data.sql

server:
  port: 8080